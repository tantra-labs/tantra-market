[package]
name = "tantra-market-finance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic market contracts, market packs, and registry — the canonical India market microstructure pack (MarketProfile, NseCalendar, statutory cost schedules, F&O grammar)"

[features]
default = ["india"]
india = []

[dependencies]
tantra-core = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Enables getrandom's `wasm_js` backend for `wasm32-unknown-unknown` (pulled via tantra-core -> uuid).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }
