[workspace]
resolver = "2"
members = [
  "crates/tantra-market",
  "crates/tantra-market-core",
  "crates/tantra-market-dhan",
  "crates/tantra-market-normalizer",
  "crates/tantra-market-indicators",
  "crates/tantra-market-signals",
  "crates/tantra-market-store",
  "crates/tantra-market-finance",
  "crates/tantra-market-pricing",
  "crates/tantra-market-zerodha",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/tantra-labs/tantra-market"

[workspace.dependencies]
# Internal cross-repo kernel
tantra-core = { path = "../tantra-core" }
# Internal market-data crates (Tier 2A port of honba-me)
tantra-market = { path = "crates/tantra-market" }
tantra-market-core = { path = "crates/tantra-market-core" }
tantra-market-dhan = { path = "crates/tantra-market-dhan" }
tantra-market-finance = { path = "crates/tantra-market-finance" }
tantra-market-pricing = { path = "crates/tantra-market-pricing" }
tantra-market-zerodha = { path = "crates/tantra-market-zerodha" }
tantra-market-normalizer = { path = "crates/tantra-market-normalizer" }
tantra-market-indicators = { path = "crates/tantra-market-indicators" }
tantra-market-signals = { path = "crates/tantra-market-signals" }
tantra-market-store = { path = "crates/tantra-market-store" }
# Performance analytics (report exporters in tantra-market-store)
tantra-agent-analytics = { path = "../tantra-agent/crates/tantra-agent-analytics" }

# Async runtime & networking (native-only crates: feed, store, loaders, brokers)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prost = "0.13"

# Serialization & typing
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
tracing = "0.1"
rust_decimal = "1"
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

# Data lakehouse (store)
arrow = "53"
parquet = { version = "53", features = ["arrow"] }
csv = "1"
flate2 = "1"

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
